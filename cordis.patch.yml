# dsh-plugin-offwork 的 bundle patch：装插件时把宿主半侧插进组合，
# 下面这份 config 是两张卡片的兜底设置（宿主读它，再经 /api/offwork/config 给卡片）。
# 想改设置优先改 ~/.dsh/offwork.json（同名字段覆盖这里，60 秒内生效、不用重启）；
# 改这里则要重跑 apply.sh + 重启 DSH Desktop。
- insert:
    - id: offwork
      name: 'dsh-plugin-offwork'
      config:
        # 上班 / 下班时间（24 小时制）
        workStart: "09:00"
        workEnd: "17:00"
        # 月薪 ÷ 月工作日 = 日薪：9000 ÷ 22 = 409.09/天，到下班点拿满
        monthlySalary: 9000
        workdaysPerMonth: 22
        # 工作日：1=周一 … 7=周日；周六周日休息
        workdays: [1, 2, 3, 4, 5]
